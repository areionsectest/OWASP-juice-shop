name: JFrog Xray Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  xray-scan:
    runs-on: ubuntu-latest

    env:
      JFROG_BUILD_NAME: owasp-juice-shop
      JFROG_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run JFrog Xray audit
        run: jf scan "./sca-test/" --fail=false --secrets=false

      - name: Collect and publish build info to Artifactory
        run: jf rt build-publish
