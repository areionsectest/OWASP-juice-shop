name: JFrog Xray Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  xray-scan:
    runs-on: ubuntu-latest

    env:
      JFROG_CLI_BUILD_NAME: owasp-juice-shop
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install sca-test dependencies via Artifactory
        working-directory: ./sca-test
        run: |
          jf npm-config --repo-resolve=annam-npm-test
          jf npm ci

      - name: Run JFrog Xray scan
        run: jf scan "./sca-test/" --watches=annam-test --fail=false
        continue-on-error: true

      - name: Publish build info to Artifactory
        run: jf rt build-publish

      - name: Trigger Xray build scan
        run: jf build-scan owasp-juice-shop "$JFROG_CLI_BUILD_NUMBER" --watches=annam-test --fail=false
